<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}reminder{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; }

        .card { background-color: #2d2d2d; border: 1px solid #3a3a3a; border-radius: 12px; }
        .card-header { background-color: #3a3a3a; border-bottom: 1px solid #4a4a4a; color: #d0d0d0; }

        .form-control, .form-select {
            background-color: #3a3a3a; border: 1px solid #4a4a4a; color: #e0e0e0;
        }
        .form-control:focus, .form-select:focus {
            background-color: #4a4a4a; border-color: #6c757d; color: #fff;
        }
        .form-control::placeholder { color: #888; }

        .btn-primary { background-color: #0d6efd; border-color: #0d6efd; }
        .btn-primary:hover { background-color: #0b5ed7; }
        .btn-outline-light { border-color: #4a4a4a; color: #e0e0e0; }
        .btn-outline-light:hover { background-color: #3a3a3a; }
        .btn-outline-secondary { border-color: #4a4a4a; color: #b0b0b0; }
        .btn-outline-secondary:hover { background-color: #3a3a3a; color: #fff; }

        .alert { background-color: #3a3a3a; border-color: #4a4a4a; color: #f8f9fa; }
        .text-muted { color: #888 !important; }

        .navbar { background-color: #2d2d2d !important; border-bottom: 1px solid #3a3a3a; }
        .navbar-brand, .navbar-text { color: #e0e0e0 !important; }

        {% block extra_css %}{% endblock %}
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
